<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Sound events: A bidirectional GRU that detects ten classes of urban sound, with a threshold tuned per class. Predicting nothing costs 108.9."><title>Sound events: A bidirectional GRU that detects ten classes of urban sound, with a threshold tuned per class. Predicting nothing costs 108.9.</title><style>@font-face{font-family:'disp';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'text';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'tok';src:url(data:font/woff2;base64,) format('woff2')}.draw{stroke-dasharray:1;animation:draw .9s cubic-bezier(.65,0,.35,1) both}@keyframes draw{from{stroke-dashoffset:1}}.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .55s cubic-bezier(.65,0,.35,1) both}@keyframes gy{from{transform:scaleY(0)}}.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx .55s cubic-bezier(.65,0,.35,1) both}@keyframes gx{from{transform:scaleX(0)}}.up{animation:up .9s cubic-bezier(.16,1,.3,1) both}@keyframes up{from{opacity:0;transform:translateY(14px)}}.carry{animation:carry .8s cubic-bezier(.16,1,.3,1) both}@keyframes carry{from{opacity:0;transform:translateX(-28px)}}.rise{animation:rise 1s cubic-bezier(.16,1,.3,1) both}@keyframes rise{from{transform:translateY(120px)}}.ride{animation:ride .9s cubic-bezier(.65,0,.35,1) both}@keyframes ride{from{transform:translateX(var(--d));opacity:0}12%{opacity:1}}.fd{animation:fd .5s ease-out both}@keyframes fd{from{opacity:0}}.still{display:none}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}.still{display:inline}}</style><defs></defs><rect width="600" height="300" fill="#f1f2f2"/><rect x="1" y="1" width="598" height="298" fill="none" stroke="rgba(12,13,13,0.16)" stroke-width="2"/><text x="30" y="44" font-family="'text',Arial,sans-serif" font-size="16" fill="#585c5e" class="fd" style="animation-delay:3.45s">dklingbeil/MLCP-Project</text><rect x="476.84" y="60" width="93.16" height="44" fill="#ffffff"/><rect x="476.84" y="60" width="93.16" height="44" fill="#ffd12e" class="gy" style="animation-delay:3.95s"/><rect x="476.84" y="60" width="93.16" height="44" fill="none" stroke="#0c0d0d" stroke-width="2"/><text x="488.84" y="92" font-family="'disp',Arial,sans-serif" font-size="28" fill="#0c0d0d" letter-spacing="-0.84" class="fd" style="animation-delay:4.3s">37.7</text><text x="570" y="126" font-family="'text',Arial,sans-serif" font-size="15" fill="#585c5e" text-anchor="end" class="fd" style="animation-delay:4.4s">final cost, lower is better</text><text x="30" y="96" font-family="'disp',Arial,sans-serif" font-size="40" fill="#0c0d0d" letter-spacing="-1.2" class="up" style="animation-delay:3.55s">Sound events</text><text x="30" y="158" font-family="'text',Arial,sans-serif" font-size="19" fill="#0c0d0d" class="up" style="animation-delay:3.75s">A bidirectional GRU that detects ten classes of urban sound,</text><text x="30" y="184" font-family="'text',Arial,sans-serif" font-size="19" fill="#0c0d0d" class="up" style="animation-delay:3.82s">with a threshold tuned per class. Predicting nothing costs 108.9.</text><path d="M0 236L600 236" pathLength="1" fill="none" stroke="#0c0d0d" stroke-width="3" class="draw" style="animation-delay:3.65s"/><g class="carry" style="animation-delay:4.35s"><rect x="30" y="252" width="66.22" height="30" fill="#ffffff" stroke="#0c0d0d" stroke-width="1.5"/><text x="40" y="273" font-family="'tok',Arial,sans-serif" font-size="16" fill="#0c0d0d">Python</text></g><g class="carry" style="animation-delay:4.43s"><rect x="104.22" y="252" width="138.98" height="30" fill="#ffffff" stroke="#0c0d0d" stroke-width="1.5"/><text x="114.22" y="273" font-family="'tok',Arial,sans-serif" font-size="16" fill="#0c0d0d">PyTorch Lightning</text></g><g class="carry" style="animation-delay:4.51s"><rect x="251.2" y="252" width="116.19" height="30" fill="#ffffff" stroke="#0c0d0d