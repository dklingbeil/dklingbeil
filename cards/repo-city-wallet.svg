t><rect x="484.04" y="60" width="85.96" height="44" fill="#ffffff"/><rect x="484.04" y="60" width="85.96" height="44" fill="#ffd12e" class="gy" style="animation-delay:3.65s"/><rect x="484.04" y="60" width="85.96" height="44" fill="none" stroke="#0c0d0d" stroke-width="2"/><text x="496.04" y="92" font-family="'disp',Arial,sans-serif" font-size="28" fill="#0c0d0d" letter-spacing="-0.84" class="fd" style="animation-delay:4s">2nd</text><text x="570" y="126" font-family="'text',Arial,sans-serif" font-size="15" fill="#585c5e" text-anchor="end" class="fd" style="animation-delay:4.1s">place at Hack-Nation Linz</text><text x="30" y="96" font-family="'disp',Arial,sans-serif" font-size="40" fill="#0c0d0d" letter-spacing="-1.2" class="up" style="animation-delay:3.25s">Lora</text><text x="30" y="158" font-family="'text',Arial,sans-serif" font-size="19" fill="#0c0d0d" class="up" style="animation-delay:3.45s">A city wallet that ranks nearby shops’ offers with a model on the</text><text x="30" y="184" font-family="'text',Arial,sans-serif" font-size="19" fill="#0c0d0d" class="up" style="animation-delay:3.52s">phone itself, so the profile never leaves the device.</text><path d="M0 236L600 236" pathLength="1" fill="none" stroke="#0c0d0d" stroke-width="3" class="draw" style="animation-delay:3.35s"/><g class="carry" style="animation-delay:4.05s"><rect x="30" y="252" width="103.07" height="30" fill="#ffffff" stroke="#0c0d0d" stroke-width="1.5"/><text x="40" y="273" font-family="'tok',Arial,sans-serif" font-size="16" fill="#0c0d0d">React Native</text></g><g class="carry" style="animation-delay:4.13s"><rect x="141.07" y="252" width="91.31" height="30" fill="#ffffff" stroke="#0c0d0d" stroke-width="1.5"/><text x="151.07" y="273" font-family="'tok',Arial,sans-serif" font-size="16" fill="#0c0d0d">TypeScript</text></g><g class="carry" style="animation-delay:4.21s"><rect x="240.38" y="252" width="139.25" height="30" fill="#ffffff" stroke="#0c0d0d" stroke-width="1.5"/><text x="250.38" y="273" font